      <stop offset="0%" stop-color="#181514"/>
      <stop offset="100%" stop-color="#0a0807"/>
    </linearGradient>
    <filter id="sgGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ff5500" flood-opacity="0.5"/>
